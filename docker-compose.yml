version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SEC_USER_AGENT=${SEC_USER_AGENT}
      - FRONTEND_URL=http://localhost:5173
      - ENABLE_PRICE_SYNC=0
      - ENABLE_PRICE_METRICS_SYNC=${ENABLE_PRICE_METRICS_SYNC:-0}
      - PRICE_METRICS_REFRESH_LIMIT=${PRICE_METRICS_REFRESH_LIMIT:-25}
      - PRICE_METRICS_REFRESH_HOURS=${PRICE_METRICS_REFRESH_HOURS:-24}
      - PRICE_WAREHOUSE_BACKEND=${PRICE_WAREHOUSE_BACKEND:-local}
      - PRICE_WAREHOUSE_PATH=${PRICE_WAREHOUSE_PATH:-backend/data/price_warehouse}
      - PRICE_WAREHOUSE_BUCKET=${PRICE_WAREHOUSE_BUCKET}
      - PRICE_WAREHOUSE_ENDPOINT_URL=${PRICE_WAREHOUSE_ENDPOINT_URL}
      - PRICE_WAREHOUSE_ACCESS_KEY_ID=${PRICE_WAREHOUSE_ACCESS_KEY_ID}
      - PRICE_WAREHOUSE_SECRET_ACCESS_KEY=${PRICE_WAREHOUSE_SECRET_ACCESS_KEY}
      - PRICE_WAREHOUSE_PREFIX=${PRICE_WAREHOUSE_PREFIX:-abrams13f/price_warehouse}
    depends_on:
      - worker

  worker:
    build: .
    command: python -m backend.worker
    environment:
      - ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SEC_USER_AGENT=${SEC_USER_AGENT}
      - ENABLE_PRICE_SYNC=0
      - ENABLE_PRICE_METRICS_SYNC=${ENABLE_PRICE_METRICS_SYNC:-0}
      - PRICE_METRICS_REFRESH_LIMIT=${PRICE_METRICS_REFRESH_LIMIT:-25}
      - PRICE_METRICS_REFRESH_HOURS=${PRICE_METRICS_REFRESH_HOURS:-24}
      - PRICE_WAREHOUSE_BACKEND=${PRICE_WAREHOUSE_BACKEND:-local}
      - PRICE_WAREHOUSE_PATH=${PRICE_WAREHOUSE_PATH:-backend/data/price_warehouse}
      - PRICE_WAREHOUSE_BUCKET=${PRICE_WAREHOUSE_BUCKET}
      - PRICE_WAREHOUSE_ENDPOINT_URL=${PRICE_WAREHOUSE_ENDPOINT_URL}
      - PRICE_WAREHOUSE_ACCESS_KEY_ID=${PRICE_WAREHOUSE_ACCESS_KEY_ID}
      - PRICE_WAREHOUSE_SECRET_ACCESS_KEY=${PRICE_WAREHOUSE_SECRET_ACCESS_KEY}
      - PRICE_WAREHOUSE_PREFIX=${PRICE_WAREHOUSE_PREFIX:-abrams13f/price_warehouse}
